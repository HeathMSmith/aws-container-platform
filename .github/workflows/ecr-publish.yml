name: ECR Image Publish

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/ecr-publish.yml"

  workflow_dispatch:
    inputs:
      service:
        description: "Application service to publish"
        required: true
        type: choice
        options:
          - api
          - info
          - advisor
      release_tag:
        description: "Optional immutable application release tag"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and Publish Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISHER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build or promote container image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REQUESTED_SERVICE: ${{ inputs.service }}
          SHA_TAG: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            SERVICE="api"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -z "${REQUESTED_SERVICE}" ]; then
              echo "ERROR: A service must be selected for a manual workflow run."
              exit 1
            fi

            SERVICE="${REQUESTED_SERVICE}"
          else
            echo "ERROR: Unsupported workflow event: ${GITHUB_EVENT_NAME}"
            exit 1
          fi

          case "${SERVICE}" in
            api)
              ECR_REPOSITORY="aws-container-platform-api"
              BUILD_CONTEXT="."
              ;;
            info)
              ECR_REPOSITORY="aws-container-platform-info"
              BUILD_CONTEXT="services/info"
              ;;
            advisor)
              ECR_REPOSITORY="aws-container-platform-advisor"
              BUILD_CONTEXT="services/advisor"
              ;;
            *)
              echo "ERROR: Unsupported service: ${SERVICE}"
              exit 1
              ;;
          esac

          echo "Service: ${SERVICE}"
          echo "ECR repository: ${ECR_REPOSITORY}"
          echo "Build context: ${BUILD_CONTEXT}"

          SHA_IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${SHA_TAG}"

          if [ -n "${RELEASE_TAG}" ]; then
            echo "Release requested: ${RELEASE_TAG}"
            echo "Source provenance tag: ${SHA_TAG}"

            echo "Verifying source image exists in ECR"

            SOURCE_DIGEST="$(
              aws ecr describe-images \
                --repository-name "${ECR_REPOSITORY}" \
                --image-ids imageTag="${SHA_TAG}" \
                --query 'imageDetails[0].imageDigest' \
                --output text
            )"

            echo "Verified source image digest: ${SOURCE_DIGEST}"

            echo "Checking that release tag is unused"

            if aws ecr describe-images \
              --repository-name "${ECR_REPOSITORY}" \
              --image-ids imageTag="${RELEASE_TAG}" \
              >/dev/null 2>&1; then
              echo "ERROR: Release tag ${RELEASE_TAG} already exists and cannot be reused."
              exit 1
            fi

            IMAGE_MANIFEST="$(
              aws ecr batch-get-image \
                --repository-name "${ECR_REPOSITORY}" \
                --image-ids imageTag="${SHA_TAG}" \
                --query 'images[0].imageManifest' \
                --output text
            )"

            echo "Promoting existing image to release tag ${RELEASE_TAG}"

            aws ecr put-image \
              --repository-name "${ECR_REPOSITORY}" \
              --image-tag "${RELEASE_TAG}" \
              --image-manifest "${IMAGE_MANIFEST}" \
              >/dev/null

            RELEASE_DIGEST="$(
              aws ecr describe-images \
                --repository-name "${ECR_REPOSITORY}" \
                --image-ids imageTag="${RELEASE_TAG}" \
                --query 'imageDetails[0].imageDigest' \
                --output text
            )"

            if [ "${SOURCE_DIGEST}" != "${RELEASE_DIGEST}" ]; then
              echo "ERROR: Release tag digest does not match source SHA digest."
              echo "Source digest:  ${SOURCE_DIGEST}"
              echo "Release digest: ${RELEASE_DIGEST}"
              exit 1
            fi

            {
              echo "## ECR Image Release"
              echo
              echo "**Release tag:** \`${RELEASE_TAG}\`"
              echo
              echo "**Git SHA:** \`${SHA_TAG}\`"
              echo
              echo "**Image digest:** \`${SOURCE_DIGEST}\`"
            } >> "$GITHUB_STEP_SUMMARY"

            echo "Release promotion verified."
            exit 0
          fi

          echo "Building ${SHA_IMAGE_URI}"

          docker build \
            --platform linux/amd64 \
            --tag "${SHA_IMAGE_URI}" \
            "${BUILD_CONTEXT}"

          echo "Publishing provenance tag ${SHA_IMAGE_URI}"

          docker push "${SHA_IMAGE_URI}"

          {
            echo "## ECR Image Build"
            echo
            echo "**Git SHA:** \`${SHA_TAG}\`"
            echo
            echo "**Image:** \`${SHA_IMAGE_URI}\`"
          } >> "$GITHUB_STEP_SUMMARY"
