name: Terraform Plan

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to plan"
        required: true
        type: choice
        options:
          - dev
          - prod

      api:
        description: "Include API service"
        required: true
        type: boolean
        default: true

      info:
        description: "Include Info service"
        required: true
        type: boolean
        default: true

      advisor:
        description: "Include Architecture Advisor service"
        required: true
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: Terraform Plan - ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      TF_VAR_alarm_notification_email: ${{ secrets.ALARM_NOTIFICATION_EMAIL }}

    defaults:
      run:
        working-directory: terraform/environments/${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.3"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure enabled services
        shell: bash
        run: |
          services=()

          if [[ "${{ inputs.api }}" == "true" ]]; then
            services+=("api")
          fi

          if [[ "${{ inputs.info }}" == "true" ]]; then
            services+=("info")
          fi

          if [[ "${{ inputs.advisor }}" == "true" ]]; then
            services+=("advisor")
          fi

          if [[ ${#services[@]} -eq 0 ]]; then
            echo "At least one application service must be enabled."
            exit 1
          fi

          enabled_services=$(printf '"%s",' "${services[@]}")
          enabled_services="[${enabled_services%,}]"

          echo "TF_VAR_enabled_services=${enabled_services}" >> "$GITHUB_ENV"
          echo "Enabled services: ${enabled_services}"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -no-color \
            -out=tfplan

      - name: Add Plan Summary
        run: |
          {
            echo "## Terraform Deployment Plan"
            echo
            echo "**Environment:** ${{ inputs.environment }}"
            echo
            echo '```terraform'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
