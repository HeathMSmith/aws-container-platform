name: Terraform Plan

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to plan"
        required: true
        type: choice
        options:
          - dev
          - prod
      image_tag:
        description: "Immutable ECR image tag to plan for deployment"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: Terraform Plan - ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: terraform/environments/${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.3"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Verify ECR image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          ECR_REPOSITORY="$(
            terraform console <<'EOF' | tr -d '"'
var.ecr_repository_names["api"]
EOF
          )"

          if [ -z "${ECR_REPOSITORY}" ]; then
            echo "ERROR: Unable to resolve API ECR repository."
            exit 1
          fi

          aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            >/dev/null

          echo "Verified ECR image: ${ECR_REPOSITORY}:${IMAGE_TAG}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_image_tag: ${{ inputs.image_tag }}
        run: |
          terraform plan \
            -no-color \
            -out=tfplan

      - name: Add Plan Summary
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          {
            echo "## Terraform Deployment Plan"
            echo
            echo "**Environment:** ${{ inputs.environment }}"
            echo
            echo "**Image tag:** \`${IMAGE_TAG}\`"
            echo
            echo '```terraform'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
