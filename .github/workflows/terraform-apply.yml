name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    name: Terraform Apply - ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: terraform/environments/${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.3"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -no-color \
            -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Wait for ECS services stability
        run: |
          CLUSTER_NAME="$(terraform output -raw ecs_cluster_name)"
          SERVICES="$(terraform output -json ecs_service_names)"

          echo "${SERVICES}" |
            jq -r 'to_entries[] | "\(.key)\t\(.value)"' |
            while IFS=$'\t' read -r SERVICE_KEY SERVICE_NAME; do
              echo "Waiting for ${SERVICE_KEY} ECS service ${SERVICE_NAME} in cluster ${CLUSTER_NAME}..."

              aws ecs wait services-stable \
                --cluster "${CLUSTER_NAME}" \
                --services "${SERVICE_NAME}"

              echo "ECS service ${SERVICE_KEY} is stable."
            done

      - name: Verify running ECS tasks
        run: |
          CLUSTER_NAME="$(terraform output -raw ecs_cluster_name)"
          SERVICES="$(terraform output -json ecs_service_names)"
          EXPECTED_IMAGES="$(terraform output -json service_container_images)"

          echo "${SERVICES}" |
            jq -r 'to_entries[] | "\(.key)\t\(.value)"' |
            while IFS=$'\t' read -r SERVICE_KEY SERVICE_NAME; do
              EXPECTED_IMAGE="$(
                echo "${EXPECTED_IMAGES}" |
                  jq -r --arg key "${SERVICE_KEY}" '.[$key]'
              )"

              TASK_ARN="$(
                aws ecs list-tasks \
                  --cluster "${CLUSTER_NAME}" \
                  --service-name "${SERVICE_NAME}" \
                  --desired-status RUNNING \
                  --query 'taskArns[0]' \
                  --output text
              )"

              if [ -z "${TASK_ARN}" ] || [ "${TASK_ARN}" = "None" ]; then
                echo "ERROR: No running ECS task was found for ${SERVICE_KEY}."
                exit 1
              fi

              RUNNING_IMAGE="$(
                aws ecs describe-tasks \
                  --cluster "${CLUSTER_NAME}" \
                  --tasks "${TASK_ARN}" \
                  --query 'tasks[0].containers[0].image' \
                  --output text
              )"

              echo "${SERVICE_KEY} expected image: ${EXPECTED_IMAGE}"
              echo "${SERVICE_KEY} running image:  ${RUNNING_IMAGE}"

              if [ "${RUNNING_IMAGE}" != "${EXPECTED_IMAGE}" ]; then
                echo "ERROR: Running ECS task for ${SERVICE_KEY} does not use the configured image."
                exit 1
              fi

              echo "Verified running ECS task for ${SERVICE_KEY}."
            done

      - name: Verify deployed container images
        run: |
          TASK_DEFINITIONS="$(terraform output -json ecs_task_definition_arns)"
          EXPECTED_IMAGES="$(terraform output -json service_container_images)"

          echo "${TASK_DEFINITIONS}" |
            jq -r 'to_entries[] | "\(.key)\t\(.value)"' |
            while IFS=$'\t' read -r SERVICE_KEY TASK_DEFINITION_ARN; do
              EXPECTED_IMAGE="$(
                echo "${EXPECTED_IMAGES}" |
                  jq -r --arg key "${SERVICE_KEY}" '.[$key]'
              )"

              DEPLOYED_IMAGE="$(
                aws ecs describe-task-definition \
                  --task-definition "${TASK_DEFINITION_ARN}" \
                  --query 'taskDefinition.containerDefinitions[0].image' \
                  --output text
              )"

              echo "${SERVICE_KEY} expected image: ${EXPECTED_IMAGE}"
              echo "${SERVICE_KEY} deployed image: ${DEPLOYED_IMAGE}"

              if [ "${DEPLOYED_IMAGE}" != "${EXPECTED_IMAGE}" ]; then
                echo "ERROR: Deployed ECS image for ${SERVICE_KEY} does not match Terraform configuration."
                exit 1
              fi

              echo "Verified deployed ECS image for ${SERVICE_KEY}."
            done

      - name: Verify application health
        run: |
          SERVICE_URLS="$(terraform output -json service_urls)"

          echo "${SERVICE_URLS}" |
            jq -r 'to_entries[] | "\(.key)\t\(.value)"' |
            while IFS=$'\t' read -r SERVICE_KEY SERVICE_URL; do
              HEALTH_URL="${SERVICE_URL}/health"

              echo "Checking ${SERVICE_KEY}: ${HEALTH_URL}"

              curl \
                --fail \
                --silent \
                --show-error \
                --retry 5 \
                --retry-delay 5 \
                --retry-all-errors \
                "${HEALTH_URL}"

              echo
              echo "Application health check passed for ${SERVICE_KEY}."
            done

      - name: Add deployment summary
        if: success()
        run: |
          CLUSTER_NAME="$(terraform output -raw ecs_cluster_name)"
          SERVICES="$(terraform output -json ecs_service_names)"
          TASK_DEFINITIONS="$(terraform output -json ecs_task_definition_arns)"
          SERVICE_URLS="$(terraform output -json service_urls)"
          SERVICE_IMAGES="$(terraform output -json service_container_images)"

          {
            echo "## ECS Deployment"
            echo
            echo "**Environment:** ${{ inputs.environment }}"
            echo
            echo "**Cluster:** \`${CLUSTER_NAME}\`"
            echo
            echo "### Services"
            echo

            echo "${SERVICES}" |
              jq -r 'keys[]' |
              while read -r SERVICE_KEY; do
                SERVICE_NAME="$(
                  echo "${SERVICES}" |
                    jq -r --arg key "${SERVICE_KEY}" '.[$key]'
                )"

                TASK_DEFINITION="$(
                  echo "${TASK_DEFINITIONS}" |
                    jq -r --arg key "${SERVICE_KEY}" '.[$key]'
                )"

                SERVICE_URL="$(
                  echo "${SERVICE_URLS}" |
                    jq -r --arg key "${SERVICE_KEY}" '.[$key]'
                )"

                SERVICE_IMAGE="$(
                  echo "${SERVICE_IMAGES}" |
                    jq -r --arg key "${SERVICE_KEY}" '.[$key]'
                )"

                echo "#### ${SERVICE_KEY}"
                echo
                echo "**Service:** \`${SERVICE_NAME}\`"
                echo
                echo "**Image:** \`${SERVICE_IMAGE}\`"
                echo
                echo "**Task definition:** \`${TASK_DEFINITION}\`"
                echo
                echo "**URL:** ${SERVICE_URL}"
                echo
              done

            echo "Deployment and application health verification completed successfully."
          } >> "$GITHUB_STEP_SUMMARY"
